<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CrossCart</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        --bg: #121212;
        --surface: #1c1c1c;
        --border: #2a2a2a;
        --text: #f2f2f2;
        --muted: #9a9a9a;
        --accent: #3d8bfd;
        --danger: #ff6b6b;
        --badge: #2b2b2b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .brand h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      .brand span {
        font-size: 11px;
        color: var(--muted);
      }

      #clear-all {
        border: 1px solid var(--border);
        background: transparent;
        color: var(--danger);
        font-size: 12px;
        font-weight: 600;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        white-space: nowrap;
      }

      #clear-all:hover {
        background: rgba(255, 107, 107, 0.12);
      }

      #cart-list {
        max-height: 420px;
        overflow-y: auto;
        padding: 10px 12px;
      }

      .empty {
        text-align: center;
        color: var(--muted);
        padding: 36px 12px;
        font-size: 13px;
      }

      .item-card {
        display: grid;
        grid-template-columns: 56px 1fr auto;
        gap: 10px;
        align-items: start;
        padding: 10px;
        margin-bottom: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      .item-card img {
        width: 56px;
        height: 56px;
        object-fit: cover;
        border-radius: 8px;
        background: #000;
      }

      .item-meta {
        min-width: 0;
      }

      .item-title {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        line-height: 1.35;
      }

      .item-title:hover {
        color: var(--accent);
      }

      .item-price {
        margin-top: 4px;
        font-size: 13px;
        color: #d8d8d8;
      }

      .item-price-original {
        margin-top: 2px;
        font-size: 11px;
        color: var(--muted);
      }

      .domain-badge {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 7px;
        border-radius: 999px;
        background: var(--badge);
        color: var(--muted);
        font-size: 10px;
        font-weight: 600;
        text-transform: lowercase;
      }

      .delete-btn {
        border: none;
        background: transparent;
        color: var(--muted);
        font-size: 16px;
        line-height: 1;
        cursor: pointer;
        padding: 2px 4px;
      }

      .delete-btn:hover {
        color: var(--danger);
      }

      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        font-size: 13px;
      }

      footer strong {
        font-weight: 700;
      }

      #cart-count {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>CrossCart</h1>
        <span>Universal product cart</span>
      </div>
      <div class="header-actions">
        <label for="currency-select" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Currency</label>
        <select id="currency-select" aria-label="Display currency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="ZAR">ZAR</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="INR">INR</option>
        </select>
        <button id="clear-all" type="button">Clear All</button>
      </div>
    </header>

    <main id="cart-list"></main>

    <footer>
      <span id="cart-count">0 items</span>
      <strong id="cart-total">$0.00</strong>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
