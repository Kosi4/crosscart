<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CrossCart</title>
  <link rel="stylesheet" href="../shared/tokens.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="crosscart-header">
    <a id="open-web-btn" class="crosscart-brand" href="#" target="_blank" rel="noopener" title="Open the CrossCart web app">
      <img src="../icons/icon48.png" alt="" class="crosscart-brand-icon" />
      CrossCart
    </a>
    <select id="currency-select"></select>
    <button id="clear-all-btn" class="crosscart-btn-secondary">Clear All</button>
  </header>

  <div class="crosscart-list-bar">
    <button id="back-btn" class="crosscart-icon-btn" title="Back to all carts" aria-label="Back to all carts">&larr;</button>
    <div id="list-title" class="crosscart-list-title">Carts</div>
    <input id="list-name-input" class="crosscart-list-name" type="text" aria-label="Cart name, edit to rename" />
    <button id="new-list-btn" class="crosscart-icon-btn" title="New cart" aria-label="New cart">+</button>
    <button id="delete-list-btn" class="crosscart-icon-btn crosscart-icon-btn-danger" aria-label="Delete a cart">&minus;</button>
  </div>

  <main id="cart-list" class="crosscart-cart-list"></main>

  <footer id="footer-summary" class="crosscart-footer"></footer>

  <script src="../shared/constants.js"></script>
  <script src="../shared/config.js"></script>
  <script src="../shared/monitor.js"></script>
  <script src="../shared/currency.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="../shared/lists.js"></script>
  <script src="../shared/dom.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../shared/currency-rates.js"></script>
  <script src="render.js"></script>
  <script src="../shared/dnd.js"></script>
  <script src="popup.js"></script>
</body>
</html>
